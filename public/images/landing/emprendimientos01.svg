<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradiente" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#A65A45" />
    </linearGradient>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#gradiente)" />
  <rect width="100%" height="100%" fill="url(#rejilla)" />

  <circle cx="680" cy="100" r="140" fill="rgba(255,255,255,0.06)" />
  <circle cx="120" cy="425" r="110" fill="rgba(0,0,0,0.12)" />

  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="48" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <text x="0" y="16" font-size="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">🚀</text>
  </g>

  <text x="400" y="305" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="0.5">
    Ideas y Negocios
  </text>
  <text x="400" y="335" font-size="13" font-weight="500" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    Proyectos con visión comunitaria
  </text>
</svg>